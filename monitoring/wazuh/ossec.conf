<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!--
    Log paths are mounted from the Docker Compose bind volumes into the
    wazuh container via the shared Incus disk device at /var/log/smartcity/.
    docker-compose.yml maps  ./logs/<service>:/var/log/<service>
    Incus maps  /shared/smartcity-logs → /var/log/smartcity  in this container.
    So Docker's ./logs/registry/access.log appears here as:
      /var/log/smartcity/registry/access.log
  -->

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/registry/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/ingestion/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/storage/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/analytics/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/ops-portal/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/alert-service/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/alert-service/mail.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/zone-aggregator-north/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/zone-aggregator-center/access.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/smartcity/zone-aggregator-south/access.log</location>
  </localfile>

  <!-- Postfix logs from mail-server container -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/smartcity/mail/mail.log</location>
  </localfile>

  <!-- Wazuh active response -->
  <command>
    <name>block-threat</name>
    <executable>block-threat.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>block-threat</command>
    <location>local</location>
    <rules_id>100002,100101,100201,100301,100303</rules_id>
    <timeout>300</timeout>
  </active-response>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
  </ruleset>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <force>
      <enabled>yes</enabled>
      <key_mismatch>yes</key_mismatch>
      <disconnected_time enabled="yes">1h</disconnected_time>
      <after_registration_time>1h</after_registration_time>
    </force>
  </auth>

  <cluster>
    <disabled>yes</disabled>
  </cluster>
</ossec_config>
