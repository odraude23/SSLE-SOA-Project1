groups:
  - name: smartcity_alerts
    rules:

      # Threat 1: DoS detection on ops-portal
      - alert: PotentialDoS
        expr: |
          sum(rate(http_requests_total{job="ops-portal"}[10s])) > 50
        for: 10s
        labels:
          severity: critical
          threat: dos
        annotations:
          summary: "Potential DoS on ops-portal"
          description: "Request rate {{ $value | humanize }}/s exceeds 50/s threshold"

      # High latency (DoS/DDoS impact)
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="ops-portal"}[1m])) by (le)
          ) > 2.0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on ops-portal"
          description: "p95 latency {{ $value | humanizeDuration }}"

      # Service down
      - alert: InstanceDown
        expr: up == 0
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.job }} is down"
          description: "Scrape target {{ $labels.instance }} has been down for >1 minute"

      # High error rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m])) by (job) > 1
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"

      # Threat 3: Email spam / alert flooding
      - alert: AlertEmailFlood
        expr: |
          increase(alert_emails_total[1m]) > 10
        for: 0s
        labels:
          severity: critical
          threat: spam
        annotations:
          summary: "Alert email flood detected"
          description: "{{ $value }} alert emails in last 60s — possible spam attack"

      # Threat 2: APT honeypot hit rate
      - alert: AptHoneypotProbing
        expr: |
          increase(wazuh_alerts_total{rule_id="100200"}[5m]) >= 3
        for: 0s
        labels:
          severity: critical
          threat: apt
        annotations:
          summary: "APT probing detected on zone aggregator honeypot"
          description: "{{ $value }} hits on /api/admin/* in 5 minutes from same source"

      # Wazuh down
      - alert: WazuhDown
        expr: wazuh_up == 0
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "Wazuh SIEM is unreachable"
