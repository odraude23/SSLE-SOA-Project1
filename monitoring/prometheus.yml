global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "service-registry"
    static_configs:
      - targets: ["service-registry:5050"]

  - job_name: "ingestion-service"
    static_configs:
      - targets: ["ingestion-service:5200"]

  - job_name: "storage-service"
    static_configs:
      - targets: ["storage-service:5300"]

  - job_name: "analytics-service"
    static_configs:
      - targets: ["analytics-service:5400"]

  - job_name: "alert-service"
    static_configs:
      - targets: ["alert-service:5500"]

  - job_name: "ops-portal"
    static_configs:
      - targets: ["ops-portal:5600"]

  - job_name: "zone-aggregator-north"
    static_configs:
      - targets: ["zone-aggregator-north:5100"]

  - job_name: "zone-aggregator-center"
    static_configs:
      - targets: ["zone-aggregator-center:5101"]

  - job_name: "zone-aggregator-south"
    static_configs:
      - targets: ["zone-aggregator-south:5102"]

  - job_name: "wazuh-exporter"
    static_configs:
      - targets: ["wazuh-exporter:9100"]

  - job_name: "threat-blocker"
    static_configs:
      - targets: ["host.docker.internal:9200"]
